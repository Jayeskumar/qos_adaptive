[project]
name = "flowpilot"
version = "1.0.0"
description = "FlowPilot - an adaptive, learning QoS engine for mixed home-broadband traffic"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "threadpoolctl>=3.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "matplotlib>=3.8",
  "websockets>=12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["flowpilot*"]

[tool.setuptools.package-data]
flowpilot = ["models/*.joblib", "models/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
